<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <meta name="apple-mobile-web-app-title" content="포켓몬TD">
  <meta name="theme-color" content="#080c14">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <title>포켓몬 타워디펜스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">


  <!-- ===== 타이틀 화면 ===== -->
  <div id="title-screen" class="screen active">
    <canvas id="title-canvas"></canvas>
    <div class="title-content">
      <div class="title-poke-label">P O K É M O N</div>
      <div class="title-logo">
        <span class="title-logo-td">TOWER</span>
        <span class="title-logo-def">DEFENSE</span>
      </div>
      <div class="title-tagline">전설의 전투가 시작된다</div>
      <button id="btn-start" class="title-start-btn">
        <span class="btn-star">⭐</span> 게임 시작 <span class="btn-star">⭐</span>
      </button>
      <div class="title-version">v2.0 · Pokemon TD</div>
    </div>
    <div class="title-pokemon-row">
      <span class="title-pkm" data-delay="0">⚡</span>
      <span class="title-pkm" data-delay="200">💗</span>
      <span class="title-pkm" data-delay="400">🥚</span>
      <span class="title-pkm" data-delay="600">🌱</span>
      <span class="title-pkm" data-delay="800">🦎</span>
      <span class="title-pkm" data-delay="1000">🐢</span>
    </div>
  </div>

  <!-- ===== 영웅 선택 (v27: 난이도/맵선택 제거, 항상 엔드리스로 존1부터 시작) ===== -->
  <div id="map-select-screen" class="screen">
    <button id="btn-title-back" class="title-back-btn">← 타이틀</button>
    <div class="title-area">
      <div class="title-pokemon">영웅 선택</div>
      <div class="title-main">누구와 함께 싸울까?</div>
      <div id="best-wave-label" style="margin-top:6px;color:#ffd60a;font-size:14px;opacity:0.9;">🏆 최고 도달 웨이브: -</div>
    </div>
    <div class="difficulty-select" id="starter-hero-select">
      <button class="diff-btn active" data-hero="pikachu" title="전기 타워 데미지 +15%">⚡ 피카츄</button>
      <button class="diff-btn" data-hero="togepi" title="전체 타워 데미지 소폭 증가 + 골드 보너스">🥚 토게피</button>
      <button class="diff-btn" data-hero="eevee" title="모든 타워 데미지 +5% (만능형, 레벨12에 3갈래 진화)">🦊 이브이</button>
    </div>
    <div id="starter-hero-desc" style="text-align:center;color:#ffd60a;font-size:12px;margin-top:-6px;margin-bottom:8px;min-height:16px;">⚡ 전기 타워 데미지 +15%</div>
    <button id="btn-title-skin" style="margin:14px auto 4px;display:block;padding:10px 24px;border-radius:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.35);color:#fff;font-size:14px;cursor:pointer;">👕 스킨 선택</button>
    <button id="btn-endless-start" style="margin:18px auto;display:block;padding:14px 40px;border-radius:14px;border:none;background:linear-gradient(135deg,#ffd60a,#ff8f00);color:#1a1200;font-size:18px;font-weight:800;cursor:pointer;">▶ 엔드리스 시작</button>
    <button id="btn-howto" style="margin:0 auto;display:block;padding:8px 20px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:#aaa;font-size:12px;cursor:pointer;">❓ 게임 방법</button>
    <button id="btn-hof" style="margin:6px auto 0;display:block;padding:8px 20px;border-radius:10px;border:1px solid rgba(255,214,10,0.3);background:transparent;color:#ffd60a;font-size:12px;cursor:pointer;">👑 명예의 전당</button>
    <button id="btn-globalrank" style="margin:6px auto 0;display:block;padding:8px 20px;border-radius:10px;border:1px solid rgba(79,195,247,0.4);background:transparent;color:#4fc3f7;font-size:12px;cursor:pointer;">🌍 전체 랭킹</button>
  </div>

  <!-- ===== 게임 화면 ===== -->
  <div id="game-screen" class="screen">
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud-top">
      <div class="hud-cell" id="hud-lives" style="display:none">❤️ <span id="lives-val">20</span></div>
      <div class="hud-cell" id="hud-gold">💰 <span id="gold-val">200</span></div>
      <div class="hud-cell" id="hud-wave">🌊 <span id="wave-val">0</span>/<span id="wave-total">∞</span></div>
      <div class="hud-cell" id="hud-score">🏅 <span id="score-val">0</span></div>
      <div class="hud-cell" id="hud-field">👾 <span id="field-count-val">0</span>/200</div>
      <div class="hud-cell" id="hud-trait" title="이번 판 시드특성" style="cursor:help">🎲</div>
      <div class="hud-cell" id="hud-timer" style="display:none">⏱ <span id="timer-val">--</span>s</div>
      <div class="hud-cell hud-combo" id="hud-combo" style="display:none">
        🔥 <span id="combo-val">0</span>콤보 <span id="combo-mul" class="combo-mul">×1.0</span>
      </div>
      <div id="hud-speed">
        <button class="speed-btn active" data-speed="1">1×</button>
        <button class="speed-btn" data-speed="2">2×</button>
        <button class="speed-btn" data-speed="3">3×</button>
      </div>
      <button id="btn-mission" class="hud-btn" title="미션 보드">🎯</button>
      <button id="btn-synergy" class="hud-btn" title="합치기 레시피 & 시너지 조합표">🔗</button>
      <button id="btn-power" class="hud-btn" title="종합 전력 요약">📈</button>
      <button id="btn-menu" class="hud-btn">⏸</button>
    </div>

    <!-- 웨이브 버튼 -->
    <button id="btn-wave" class="wave-btn">▶ 웨이브 1</button>

    <!-- 타워 바 -->
    <div id="tower-bar"></div>

    <!-- 뒤로 -->
    <button id="btn-back" class="back-btn">← 맵</button>
    <button id="btn-recenter" class="back-btn" style="right:8px;left:auto;top:calc(env(safe-area-inset-top,0) + var(--hud-h) + 46px);position:absolute;" title="카메라를 중앙으로">🎯 중앙으로</button>
  </div>

</div>

<script src="engine.js"></script>
<script src="maps.js"></script>
<script src="sprites.js"></script>
<script src="enemies.js"></script>
<script src="towers.js"></script>
<script src="heroes.js"></script>
<script src="shop.js"></script>
<script src="gacha.js"></script>
<!-- v27-18: 전체 랭킹용 Firebase (요청 - 구글 서비스로 기록 저장) -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="leaderboard.js"></script>
<script src="main.js"></script>
<script src="ui-builders.js"></script>
</body>
</html>
