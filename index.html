<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <meta name="apple-mobile-web-app-title" content="포켓몬TD">
  <meta name="theme-color" content="#0b0d12">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json?v=42">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <title>포켓몬 타워디펜스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">


  <!-- ===== 타이틀 화면 ===== -->
  <div id="title-screen" class="screen active">
    <canvas id="title-canvas"></canvas>
    <div class="title-content">
      <div class="title-poke-label">POKÉMON</div>
      <div class="title-logo">
        <span class="title-logo-td">TOWER</span>
        <span class="title-logo-def">DEFENSE</span>
      </div>
      <div class="title-tagline">1세대 151마리로 2세대 군단을 막아라</div>
      <button id="btn-start" class="title-start-btn">
        게임 시작
      </button>
      <div class="title-version" id="app-version">v3.6 · 10/28 · #50</div>
    </div>
    <div class="title-pokemon-row" aria-hidden="true">
      <img class="title-pkm" src="assets/towers/bulbasaur.png" alt="">
      <img class="title-pkm" src="assets/towers/charmander.png" alt="">
      <img class="title-pkm lead" src="assets/towers/pikachu.png" alt="">
      <img class="title-pkm" src="assets/towers/squirtle.png" alt="">
      <img class="title-pkm" src="assets/towers/eevee.png" alt="">
    </div>
  </div>

  <!-- ===== 영웅 선택 (v27: 난이도/맵선택 제거, 항상 엔드리스로 존1부터 시작) ===== -->
  <div id="map-select-screen" class="screen">
    <button id="btn-title-back" class="title-back-btn"><i data-ic="back"></i>타이틀</button>
    <div class="title-area">
      <div class="title-pokemon">영웅 선택</div>
      <div class="title-main">누구와 함께 싸울까?</div>
      <div id="best-wave-label">최고 기록 -</div>
    </div>
    <div class="difficulty-select" id="starter-hero-select">
      <button class="diff-btn active" data-hero="pikachu" title="전기 타워가 많을수록 강해지는 딜러 · Lv업 시 라이츄"><img src="assets/heroes/pikachu.png" alt=""><b>피카츄</b><small>딜러</small></button>
      <button class="diff-btn" data-hero="togepi" title="골드·이자·합성 운을 올리는 지원형 · Lv업 시 토게틱"><img src="assets/heroes/togepi.png" alt=""><b>토게피</b><small>경제</small></button>
      <button class="diff-btn" data-hero="eevee" title="Lv12에 부스터·쥬피썬더·샤미드 중 진화 선택 · 같은 갈래 스킬 ×1.5"><img src="assets/heroes/eevee.png" alt=""><b>이브이</b><small>진화 분기</small></button>
    </div>
    <div id="starter-hero-desc">전기 타워가 많을수록 강해지는 딜러 · Lv업 시 라이츄</div>
    <button id="btn-endless-start">게임 시작</button>
    <nav class="ms-links">
      <button id="btn-howto"><i data-ic="help"></i>게임 방법</button>
      <button id="btn-hof"><i data-ic="crown"></i>명예의 전당</button>
      <button id="btn-globalrank"><i data-ic="globe"></i>전체 랭킹</button>
    </nav>
  </div>

  <!-- ===== 게임 화면 ===== -->
  <div id="game-screen" class="screen">
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud-top">
      <div class="hud-cell" id="hud-lives" style="display:none"><i data-ic="heart"></i><span id="lives-val">20</span></div>
      <div class="hud-cell" id="hud-gold"><i data-ic="coin"></i><span id="gold-val">200</span></div>
      <div class="hud-cell" id="hud-wave"><i data-ic="wave"></i><span id="wave-val">0</span>/<span id="wave-total">∞</span></div>
      <div class="hud-cell" id="hud-score"><i data-ic="medal"></i><span id="score-val">0</span></div>
      <div class="hud-cell" id="hud-field" title="필드 몬스터 (200마리가 되면 패배)"><i data-ic="monster"></i><span id="field-count-val">0</span><span class="fg-bar"><i id="field-gauge"></i></span></div>
      <div class="hud-cell" id="hud-cards" style="display:none;cursor:pointer" title="내 강화 카드 보기" onclick="app._openCardList()"><i data-ic="card"></i><span>0</span></div>
      <div class="hud-cell" id="hud-stones" style="display:none" title="메가스톤 (20웨이브 보스에서 확률 드롭)"><i data-ic="gem"></i><span>0</span></div>
      <div class="hud-cell" id="hud-div" style="display:none" title="서로 다른 타입 수 보너스 (4종 +10% · 5종 +20% · 6종 +30%)"><i data-ic="prism"></i><span>0</span></div>
      <div class="hud-cell" id="hud-trait" title="이번 판 시드특성" style="cursor:help"><i data-ic="dice"></i></div>
      <div class="hud-cell" id="hud-timer" style="display:none"><i data-ic="timer"></i><span id="timer-val">--</span>s</div>
      <div id="hud-ctrl">
        <div id="hud-speed">
          <button class="speed-btn active" data-speed="1">1×</button>
          <button class="speed-btn" data-speed="2">2×</button>
          <button class="speed-btn" data-speed="3">3×</button>
        </div>
        <button id="btn-cam-reset" class="hud-btn" title="화면 원위치 (카메라 줌/위치 초기화)"><i data-ic="compass"></i></button>
        <button id="btn-mission" class="hud-btn" title="미션 보드"><i data-ic="target"></i></button>
        <button id="btn-power" class="hud-btn" title="종합 전력 요약"><i data-ic="chart"></i></button>
        <button id="btn-menu" class="hud-btn"><i data-ic="pause"></i></button>
      </div>
    </div>

    <!-- 웨이브 버튼 -->
    <button id="btn-wave" class="wave-btn">웨이브 1 시작</button>

    <!-- 타워 바 -->
    <div id="tower-bar"></div>

    <!-- 뒤로 -->
    <button id="btn-back" class="back-btn">← 맵</button>
  </div>

</div>

<script src="icons.js"></script>
<script src="engine.js"></script>
<script src="maps.js"></script>
<script src="sprites.js"></script>
<script src="enemies.js"></script>
<script src="towers.js"></script>
<script src="heroes.js"></script>
<script src="shop.js"></script>
<script src="gacha.js"></script>
<script src="pokedex.js"></script>
<!-- v27-18: 전체 랭킹용 Firebase (요청 - 구글 서비스로 기록 저장) -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="leaderboard.js"></script>
<script src="main.js"></script>
<script src="ui-builders.js"></script>
<script src="storage.js"></script>
<script src="mega.js"></script>
<script src="cards.js"></script>
</body>
</html>
